[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgshop27-pipeline"
version = "0.1.0"
description = "Pipeline to fetch, inspect, visualize, solve and score CG:SHOP 2027 instances."
requires-python = ">=3.11"
dependencies = [
  "cgshop2027-pyutils>=0.1.0",
  "numpy",
  "matplotlib",
  "pillow",
]

[project.scripts]
cg27 = "cgshop27.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
